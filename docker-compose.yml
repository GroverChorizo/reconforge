version: "3.9"

services:
  reconforge:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
    image: reconforge:latest
    container_name: reconforge
    restart: unless-stopped

    ports:
      - "8342:8342"

    volumes:
      # Persist all scan data, DB, screenshots, backups
      - recon_data:/data

    environment:
      RECON_DATA_DIR: /data
      # Optionally set API keys via environment:
      # GITHUB_TOKEN: ghp_xxxx

    # Limit resource usage to avoid saturating the host
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G

    # healthcheck mirrors the Dockerfile HEALTHCHECK
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8342/api/state"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

    # Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  recon_data:
    driver: local
