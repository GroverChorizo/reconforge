[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconforge"
version = "2.0.0-dev"
description = "Local-first bug-bounty recon, monitoring, and reporting console"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ReconForge maintainers"}]

dependencies = [
    # Phase 1-3 (already runnable on stdlib alone; psutil is optional)
    "psutil>=5.9",

    # Phase 5 — agent runtime. Pin to a known-good minor.
    "claude-agent-sdk>=0.1.0",

    # Phase 5 — schema-validated agent I/O
    "pydantic>=2.6,<3",

    # Phase 11 — TUI wizard
    "textual>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
reconforge = "reconforge.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reconforge*", "core*", "db*", "tools*", "attack*", "api*",
           "ui*", "agents*", "vault*", "submissions*", "wizard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
