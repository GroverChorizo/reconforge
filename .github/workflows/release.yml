name: release

on:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./reconforge
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/reconforge:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/reconforge:latest

  installer:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pin version into installer
        run: |
          mkdir -p dist
          sed -e "s|RECONFORGE_VERSION:-latest|RECONFORGE_VERSION:-${GITHUB_REF_NAME}|" \
              installer/install.sh > dist/install.sh
          chmod +x dist/install.sh
          cp installer/reconforge-cli dist/
          cp installer/reconforge.desktop dist/
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/install.sh
            dist/reconforge-cli
            dist/reconforge.desktop
          generate_release_notes: true
